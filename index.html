<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koko ruudun paikallinen maailmankartta</title>
    <style>
        /* Pakotetaan näkymä koko ruudun kokoiseksi (100vh ja 100vw) */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #bad3fc; /* Meren sininen */
            height: 100vh;
            width: 100vw;
        }
        svg {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- Paikallinen maailmankartta suoraan koodissa (Ei vaadi nettiyhteyttä) -->
    <svg viewBox="0 0 1008 651" xmlns="http://w3.org">
        <g fill="#fdfbe7" stroke="#4a4a4a" stroke-width="1">
            <!-- Pohjois-Amerikka ja Grönlanti -->
            <path d="M110,65 L165,30 L280,35 L430,90 L395,175 L360,165 L330,195 L275,190 L210,310 L160,320 L150,260 L80,240 L50,170 Z" />
            <!-- Etelä-Amerikka -->
            <path d="M210,315 L270,305 L310,350 L345,400 L280,570 L240,590 L220,500 L180,390 Z" />
            <!-- Eurooppa ja Aasia -->
            <path d="M435,95 L490,65 L570,70 L720,50 L890,60 L960,110 L940,240 L970,300 L910,380 L880,320 L810,390 L755,395 L725,310 L630,340 L585,250 L535,270 L485,185 Z" />
            <!-- Afrikka -->
            <path d="M440,240 L515,200 L580,250 L630,285 L600,410 L540,510 L510,510 L475,370 L425,320 Z" />
            <!-- Australia -->
            <path d="M800,450 L890,440 L930,500 L890,540 L810,520 Z" />
            <!-- Iso-Britannia & Irlanti -->
            <path d="M420,130 L435,125 L430,145 L415,140 Z" />
            <!-- Madagaskar -->
            <path d="M605,440 L620,450 L610,490 L595,470 Z" />
            <!-- Japani -->
            <path d="M940,180 L955,190 L945,230 L930,210 Z" />
        </g>
        <!-- Punainen kohdistuspiste (esim. Helsinki) -->
        <circle cx="510" cy="120" r="8" fill="#ff2222" stroke="#fff" stroke-width="2" />
    </svg>

</body>
</html>
