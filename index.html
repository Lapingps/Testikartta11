<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Oikea OpenStreetMap</title>
    
    <!-- Ladataan viralliset Leaflet-karttakirjastot netistä -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        /* Poistetaan selaimen omat tyhjät reunat */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Karttaelementti, johon pakotettu tyyliasetukset suoraan (100vh ja 100vw) -->
    <div id="map" style="height: 100vh; width: 100vw; position: absolute; top: 0; left: 0;"></div>

    <script>
        // Luodaan karttaobjekti. Keskipisteeksi asetetaan [0, 0] eli maailman keskiö, zoom 2.
        var map = L.map('map').setView([0, 0], 2);

        // Ladataan ja näytetään aito, virallinen OpenStreetMap-karttadata
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
        }).addTo(map);
    </script>

</body>
</html>
